# Per-namespace governance: caps resource usage per pillar-stage and
# isolates namespaces from each other at the network layer. k3s enables its
# kube-router network policy controller by default, so these NetworkPolicies
# are actually enforced (not just descriptive). qa gets a bit more headroom
# than dev since it's used for pre-promotion validation, not just scratch
# work.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pillar-quota
  namespace: consumer-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: consumer-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: consumer-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
