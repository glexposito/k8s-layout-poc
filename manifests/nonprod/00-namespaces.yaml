# Namespaces for the nonprod cluster: one per pillar per stage, including
# chaos (platform tooling is a pillar too). dev/qa are internal-only and safe
# to break - they exist to catch app and infra/config issues before anything
# reaches a customer (see README "Namespace design rationale").
# cost-center values are illustrative placeholders, not real Finance codes.
apiVersion: v1
kind: Namespace
metadata:
  name: marines-dev
  labels:
    environment: nonprod
    stage: dev
    pillar: marines
    cost-center: cc-1001
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: marines-qa
  labels:
    environment: nonprod
    stage: qa
    pillar: marines
    cost-center: cc-1001
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: necrons-dev
  labels:
    environment: nonprod
    stage: dev
    pillar: necrons
    cost-center: cc-1002
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: necrons-qa
  labels:
    environment: nonprod
    stage: qa
    pillar: necrons
    cost-center: cc-1002
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-dev
  labels:
    environment: nonprod
    stage: dev
    pillar: chaos
    cost-center: cc-1000
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-qa
  labels:
    environment: nonprod
    stage: qa
    pillar: chaos
    cost-center: cc-1000
    managed-by: k8s-layout-poc
