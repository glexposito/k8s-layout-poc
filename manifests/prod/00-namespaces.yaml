# Namespaces for the prod cluster: one per pillar per stage, including chaos
# (platform tooling is a pillar too). stg and prod are both customer-facing
# here - stg is a canary gate for prod, not a throwaway test tier, so both
# get the same quota/RBAC rigor (see README "Namespace design rationale").
# `chaos-prod` is reserved for Argo CD once it's installed on this cluster
# (see "Roadmap"). cost-center values are illustrative placeholders, not
# real Finance codes.
apiVersion: v1
kind: Namespace
metadata:
  name: marines-stg
  labels:
    environment: prod
    stage: stg
    pillar: marines
    cost-center: cc-1001
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: marines-prod
  labels:
    environment: prod
    stage: prod
    pillar: marines
    cost-center: cc-1001
    managed-by: k8s-layout-poc
---
