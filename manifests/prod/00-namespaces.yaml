  labels:
    environment: prod
    stage: stg
    pillar: engagement
    cost-center: cc-1002
    managed-by: k8s-layout-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: engagement-prod
  labels:
    environment: prod
    stage: prod
    pillar: engagement
    cost-center: cc-1002
    managed-by: k8s-layout-poc
