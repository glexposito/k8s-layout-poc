# Per-namespace governance: caps resource usage per pillar-stage and
# isolates namespaces from each other at the network layer. k3s enables its
# kube-router network policy controller by default, so these NetworkPolicies
# are actually enforced (not just descriptive). stg and prod are both
# customer-facing (see README "Namespace design rationale"), so both get
# meaningful quotas - prod's is larger since it carries full traffic while
# stg is a smaller canary tier.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pillar-quota
  namespace: marines-stg
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: marines-stg
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: marines-stg
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pillar-quota
  namespace: marines-prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "40"
