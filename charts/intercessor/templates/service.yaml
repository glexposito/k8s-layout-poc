apiVersion: v1
kind: Service
metadata:
  name: {{ include "intercessor.fullname" . }}
  labels:
    {{- include "intercessor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "intercessor.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
