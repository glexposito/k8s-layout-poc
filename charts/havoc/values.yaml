# app.kubernetes.io/part-of - the pillar this app belongs to.
partOf: chaos

replicaCount: 1

image:
  repository: nginxdemos/hello
  tag: "plain-text"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 80

# Reported via the APP_ENV env var - every stage below sets this
# explicitly so it's never silently left at the default.
appEnvironment: production

probes:
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
