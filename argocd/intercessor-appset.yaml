# Deploys the marines pillar's example app (charts/intercessor) into its
# own namespaces across both clusters - dev/qa in nonprod, stg/prod in
# prod. This is the multi-cluster-from-one-Argo-CD piece: dev/qa target the
# registered remote cluster, stg/prod target the in-cluster address.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: intercessor-appset
  namespace: chaos-prod
spec:
  generators:
    - list:
        elements:
          - stage: dev
            environment: nonprod
            server: https://k3s-nonprod:6443
          - stage: qa
            environment: nonprod
            server: https://k3s-nonprod:6443
          - stage: stg
            environment: prod
            server: https://kubernetes.default.svc
          - stage: prod
            environment: prod
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'intercessor-{{stage}}'
      namespace: chaos-prod
      labels:
        pillar: marines
        stage: '{{stage}}'
        environment: '{{environment}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/glexposito/k8s-layout-poc.git
        targetRevision: HEAD
        path: charts/intercessor
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{stage}}.yaml'
      destination:
        server: '{{server}}'
        namespace: 'marines-{{stage}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
