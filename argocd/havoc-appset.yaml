# Deploys the chaos pillar's example app (charts/havoc) into its
# own namespaces across both clusters - dev/qa in nonprod, stg/prod in
# prod. This is the multi-cluster-from-one-Argo-CD piece: dev/qa target the
# registered remote cluster, stg/prod target the in-cluster address.
#
# TODO: replace repoURL once this repo has a real remote.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: havoc-appset
  namespace: chaos-prod
spec:
  generators:
    - list:
        elements:
          - stage: dev
            server: https://k3s-nonprod:6443
          - stage: qa
            server: https://k3s-nonprod:6443
          - stage: stg
            server: https://kubernetes.default.svc
          - stage: prod
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'havoc-{{stage}}'
      namespace: chaos-prod
    spec:
      project: default
      source:
        repoURL: https://github.com/REPLACE_ME/k8s-layout-poc.git
        targetRevision: HEAD
        path: charts/havoc
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{stage}}.yaml'
      destination:
        server: '{{server}}'
        namespace: 'chaos-{{stage}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
