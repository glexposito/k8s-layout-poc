# One Application per cluster, each syncing that cluster's manifests/
# directory from this repo (namespaces, quotas, RBAC, network policies) -
# the same content k3s's own auto-deploy mechanism applies today, now
# managed via GitOps instead. This is the governance layer; actual app
# workloads are handled separately by intercessor/immortal/havoc-appset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters-appset
  namespace: chaos-prod
spec:
  generators:
    - list:
        elements:
          - cluster: nonprod
            server: https://k3s-nonprod:6443
          - cluster: prod
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'manifests-{{cluster}}'
      namespace: chaos-prod
      labels:
        environment: '{{cluster}}'
        layer: governance
    spec:
      project: platform
      source:
        repoURL: https://github.com/glexposito/k8s-layout-poc.git
        targetRevision: HEAD
        path: 'manifests/{{cluster}}'
      destination:
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
