# Platform-owned: namespace/quota/RBAC governance (manifests-nonprod,
# manifests-prod) - the layer with cluster-scoped access, so it's kept
# separate from product-pillar projects, which get none at all.
#
# sync-wave -1 so this (and the other three AppProjects) get created
# before clusters-appset.yaml / the app-appsets try to generate
# Applications that reference them - an Application referencing a project
# that doesn't exist yet fails validation.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: chaos-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: >-
    Namespace/quota/RBAC governance and the app-of-apps bootstrap itself.
    Not for product workloads - see the marines/necrons/chaos projects.
  sourceRepos:
    - https://github.com/glexposito/k8s-layout-poc.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
    - server: https://k3s-nonprod:6443
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
