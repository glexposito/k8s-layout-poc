# The official Argo CD install manifest hardcodes the "argocd" namespace
# throughout - including inside RoleBinding/ClusterRoleBinding subjects.
# `kubectl apply -n chaos-prod` alone doesn't fix that (it only redirects
# resources that don't already specify a namespace, and never touches RBAC
# subject references). kustomize's namespace transformer fixes RoleBinding
# subjects automatically, but NOT ClusterRoleBinding subjects (a
# cluster-scoped binding isn't assumed to belong to the target namespace) -
# those three need an explicit patch below, confirmed by rendering this
# kustomization and checking `kind: ClusterRoleBinding` subjects still said
# `namespace: argocd` without them.
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
namespace: chaos-prod
patches:
  - target:
      kind: ClusterRoleBinding
      name: argocd-application-controller
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: chaos-prod
  - target:
      kind: ClusterRoleBinding
      name: argocd-applicationset-controller
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: chaos-prod
  - target:
      kind: ClusterRoleBinding
      name: argocd-server
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: chaos-prod
  # The install manifest doesn't set resources on application-controller
  # at all, so it inherits chaos-prod's own LimitRange default (200m/256Mi
  # - sized for this repo's lightweight demo apps, not a control-plane
  # component). Caching resource state for a second cluster (nonprod)
  # exceeds that - confirmed via `kubectl get pod ... -o
  # jsonpath='{.status.containerStatuses[0].lastState.terminated}'`
  # showing `"reason":"OOMKilled"`, silently, with no application-level
  # error logged (SIGKILL gives the process no chance to log anything).
  # `add` (not `replace`) since the base manifest has no resources field
  # to replace - it's the LimitRange injecting one, not this StatefulSet.
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 768Mi
